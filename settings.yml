enabled_by_default:
  type: bool
  default: false
  description: "Booru view is on for people who have never touched the toggle. Anyone who has chosen on or off keeps their choice."
sidebar_width:
  type: integer
  default: 280
  min: 200
  max: 480
  description: "Width of the tag sidebar in pixels (desktop)."
sidebar_page_size:
  type: integer
  default: 60
  min: 10
  max: 300
  description: "How many tags the sidebar shows before 'show more'."
min_tag_count:
  type: integer
  default: 1
  min: 0
  description: "Hide tags used on fewer topics than this."
hidden_tags:
  type: list
  list_type: tag
  default: ""
  description: "Tags that never appear in the sidebar list (they can still be typed into the search box)."
published_date_mode:
  type: enum
  default: always
  choices:
    - always
    - booru
    - disabled
  description: "Date shown in topic lists instead of the last-activity date: the date the topic was first posted. 'always' = everywhere, 'booru' = only in booru view, 'disabled' = Discourse's normal last-activity date."
tag_pages_as_filter:
  type: bool
  default: true
  description: "In booru view, open tag pages (/tag/name) as a filter search (/filter?q=tag:name) so the tag sidebar and sorting are available."
full_width_desktop:
  type: bool
  default: true
  description: "In booru view on desktop, list pages (tag sidebar or thumbnail grid) use the whole window width instead of the centred, width-capped column. Topic pages are not affected."
full_width_margin:
  type: integer
  default: 24
  min: 0
  max: 200
  description: "Space in pixels left and right of the page when full_width_desktop is on."
thumbnail_min_width:
  type: integer
  default: 170
  min: 100
  max: 400
  description: "Minimum thumbnail width in pixels in booru view. Smaller means a denser grid."
fit_masonry_to_text:
  type: bool
  default: true
  description: "Make cards in the masonry thumbnail layout tall enough for their tags and title, so long tag lists no longer spill onto the card below. Applies to everyone, not only booru view."
masonry_min_image_height:
  type: integer
  default: 120
  min: 0
  max: 400
  description: "When a card has to be made taller for its text, the image keeps at least this many pixels of height (or its natural height if smaller). Only used when fit_masonry_to_text is on."
search_thumbnails:
  type: bool
  default: true
  description: "Show the topic's image next to each result on the search page."
search_thumbnail_size:
  type: integer
  default: 120
  min: 60
  max: 300
  description: "Width and height of the search page thumbnails in pixels (they are cropped square)."
new_strip_audience:
  type: enum
  default: admins
  choices:
    - admins
    - staff
    - everyone
  description: "Who sees the 'new this week' strip. Starts on admins so you can check how it looks; switch to everyone when happy. Off for nobody is not an option: use new_strip_enabled."
new_strip_enabled:
  type: bool
  default: true
  description: "Show a strip of this week's new topics above the topic lists (Latest, New, Unread, Top)."
new_strip_title:
  type: string
  default: "New this week"
  description: "Heading of the strip. Empty for none."
new_strip_count:
  type: integer
  default: 8
  min: 1
  max: 24
  description: "How many tiles."
new_strip_days:
  type: integer
  default: 7
  min: 1
  max: 30
  description: "A topic counts as new for this many days after it was created."
new_strip_order:
  type: enum
  default: shuffle
  choices:
    - shuffle
    - newest
    - popular
  description: "Which of the week's topics fill the tiles. shuffle: a different selection every hour, so Monday's work gets as much exposure as this morning's. newest: strictly the latest. popular: most liked."
new_strip_hide_seen:
  type: bool
  default: true
  description: "For logged-in people, leave out topics they have already read."
new_strip_exclude_categories:
  type: list
  list_type: category
  default: ""
  description: "Categories that never appear in the strip."
new_strip_tile_size:
  type: integer
  default: 150
  min: 90
  max: 300
  description: "Minimum tile width in pixels; tiles grow to fill the row."

