enabled_by_default:
  type: bool
  default: false
  description: "Booru view is on for people who have never touched the toggle. Anyone who has chosen on or off keeps their choice."
sidebar_width:
  type: integer
  default: 280
  min: 200
  max: 480
  description: "Width of the tag sidebar in pixels (desktop)."
sidebar_page_size:
  type: integer
  default: 60
  min: 10
  max: 300
  description: "How many tags the sidebar shows before 'show more'."
min_tag_count:
  type: integer
  default: 1
  min: 0
  description: "Hide tags used on fewer topics than this."
hidden_tags:
  type: list
  list_type: tag
  default: ""
  description: "Tags that never appear in the sidebar list (they can still be typed into the search box)."
published_date_mode:
  type: enum
  default: always
  choices:
    - always
    - booru
    - disabled
  description: "Date shown in topic lists instead of the last-activity date: the date the topic was first posted. 'always' = everywhere, 'booru' = only in booru view, 'disabled' = Discourse's normal last-activity date."
tag_pages_as_filter:
  type: bool
  default: true
  description: "In booru view, open tag pages (/tag/name) as a filter search (/filter?q=tag:name) so the tag sidebar and sorting are available."
full_width_desktop:
  type: bool
  default: true
  description: "In booru view on desktop, list pages (tag sidebar or thumbnail grid) use the whole window width instead of the centred, width-capped column. Topic pages are not affected."
full_width_margin:
  type: integer
  default: 24
  min: 0
  max: 200
  description: "Space in pixels left and right of the page when full_width_desktop is on."
thumbnail_min_width:
  type: integer
  default: 170
  min: 100
  max: 400
  description: "Minimum thumbnail width in pixels in booru view. Smaller means a denser grid."
fit_masonry_to_text:
  type: bool
  default: true
  description: "Make cards in the masonry thumbnail layout tall enough for their tags and title, so long tag lists no longer spill onto the card below. Applies to everyone, not only booru view."
masonry_min_image_height:
  type: integer
  default: 120
  min: 0
  max: 400
  description: "When a card has to be made taller for its text, the image keeps at least this many pixels of height (or its natural height if smaller). Only used when fit_masonry_to_text is on."

# --- TEMPORARY donation banner -------------------------------------------------------
# Stand-in until the discourse-sorting plugin's donation tracker is deployed. It shows
# a thermometer with an amount you type in yourself. It switches itself off as soon as
# the plugin's own `discourse_sorting_donations_enabled` is on, so remove this whole
# block (plus donation-banner.js / .gjs and its SCSS) once the plugin is live.
donation_banner_enabled:
  type: bool
  default: false
  description: "Show the temporary donation banner above topic lists."
donation_banner_audience:
  type: enum
  default: admins
  choices:
    - admins
    - staff
    - everyone
  description: "Who sees it. Keep it on admins while you check how it looks."
donation_banner_goal:
  type: integer
  default: 50
  min: 1
  description: "Monthly goal, in whole currency units."
donation_banner_raised:
  type: float
  default: 0
  min: 0
  description: "Raised so far. You update this by hand (for example on the 1st of the month, back to 0)."
donation_banner_currency_symbol:
  type: string
  default: "$"
  description: "Symbol written before the amounts, for example $ or €."
donation_banner_title:
  type: string
  default: "Server costs this month"
  description: "Heading."
donation_banner_message:
  type: string
  default: ""
  description: "Optional sentence under the heading, for example what the money pays for."
donation_banner_progress_text:
  type: string
  default: "{raised} of {goal}"
  description: "Amounts line. {raised} and {goal} are replaced with the amounts."
donation_banner_percent_text:
  type: string
  default: "{percent}% of this month's goal"
  description: "Line under the bar. {percent} is replaced with the percentage."
donation_banner_reached_text:
  type: string
  default: "Goal reached this month. Thank you!"
  description: "Shown instead of the percentage once the goal is reached."
donation_banner_button_text:
  type: string
  default: "Donate"
  description: "Label of the button."
donation_banner_url:
  type: string
  default: "https://ko-fi.com/fcom"
  description: "Where the title, the bar and the button lead. Empty for no link and no button."
donation_banner_dismissible:
  type: bool
  default: false
  description: "Let visitors hide it with an X for the rest of their browser session."
