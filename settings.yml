enabled_by_default:
  type: bool
  default: false
  description: "Booru view is on for people who have never touched the toggle. Anyone who has chosen on or off keeps their choice."
sidebar_width:
  type: integer
  default: 280
  min: 200
  max: 480
  description: "Width of the tag sidebar in pixels (desktop)."
sidebar_page_size:
  type: integer
  default: 60
  min: 10
  max: 300
  description: "How many tags the sidebar shows before 'show more'."
min_tag_count:
  type: integer
  default: 1
  min: 0
  description: "Hide tags used on fewer topics than this."
hidden_tags:
  type: list
  list_type: tag
  default: ""
  description: "Tags that never appear in the sidebar list (they can still be typed into the search box)."
published_date_mode:
  type: enum
  default: always
  choices:
    - always
    - booru
    - disabled
  description: "Date shown in topic lists instead of the last-activity date: the date the topic was first posted. 'always' = everywhere, 'booru' = only in booru view, 'disabled' = Discourse's normal last-activity date."
tag_pages_as_filter:
  type: bool
  default: true
  description: "In booru view, open tag pages (/tag/name) as a filter search (/filter?q=tag:name) so the tag sidebar and sorting are available."
full_width_desktop:
  type: bool
  default: true
  description: "In booru view on desktop, list pages (tag sidebar or thumbnail grid) use the whole window width instead of the centred, width-capped column. Topic pages are not affected."
full_width_margin:
  type: integer
  default: 24
  min: 0
  max: 200
  description: "Space in pixels left and right of the page when full_width_desktop is on."
thumbnail_min_width:
  type: integer
  default: 170
  min: 100
  max: 400
  description: "Minimum thumbnail width in pixels in booru view. Smaller means a denser grid."
